version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant_terminal
    ports:
      - "5432:5432"
    volumes:
      - quant_pg_data:/var/lib/postgresql/data

volumes:
  quant_pg_data:
